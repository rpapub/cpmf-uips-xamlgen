[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpmf-uips-xamlgen"
dynamic = ["version"]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.24.1",
]

[project.scripts]
xamlgen = "cpmf_uips_xamlgen.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require real catalog fixtures (deselect with -m 'not integration')",
]

[tool.hatch.version]
path = "src/cpmf_uips_xamlgen/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cpmf_uips_xamlgen"]
